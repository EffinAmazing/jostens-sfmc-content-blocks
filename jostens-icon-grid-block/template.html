<style type="text/css">
@media only screen and (max-width: 550px) {
  .icon-col { display:inline-block !important; width:46% !important; padding-left:2% !important; padding-right:2% !important; }
}
</style>
<table class="icon-grid-section" border="0" cellpadding="0" cellspacing="0" role="presentation" style="width:100%; border-collapse:collapse; mso-table-lspace:0; mso-table-rspace:0; background-color:{{bgColor}};" width="100%">
  <!--[if mso]>
  <style>
    [data-ogsb] .icon-grid-section { background-color: {{bgColor}} !important; }
    [data-ogsb] .icon-grid-section .header-text { color: {{textColor}} !important; }
    [data-ogsb] .icon-grid-section .body-text { color: {{textColor}} !important; }
    [data-ogsb] .icon-grid-section v\:roundrect { fill: {{btnColor}} !important; }
    [data-ogsb] .icon-grid-section center { color: {{btnTextColor}} !important; }
    [data-ogsb] .icon-grid-section .cta-button { background-color: {{btnColor}} !important; color: {{btnTextColor}} !important; }
  </style>
  <![endif]-->
  <tr>
    <td align="center" style="padding:30px 20px 10px; font-family:Helvetica, Arial, sans-serif, Roboto; font-size:24px; line-height:32px; font-weight:bold; letter-spacing:0; color:{{textColor}}; mso-color-alt:{{textColor}};">
      <div class="header-text">{{headerText}}</div>
    </td>
  </tr>
  <tr>
    <td align="center" style="padding:0 20px 20px; font-family:Helvetica, Arial, sans-serif; font-size:15px; line-height:24px; color:{{textColor}}; mso-color-alt:{{textColor}};">
      <div class="body-text">{{bodyText}}</div>
    </td>
  </tr>
  <tr>
    <td align="center" style="padding:0; margin:0;">
      <table border="0" cellpadding="0" cellspacing="0" role="presentation" style="width:100%; border-collapse:collapse;" width="100%">
        <tr>
          <td align="center" class="icon-col" style="width:25%; padding:10px;" valign="top">
            <table border="0" cellpadding="0" cellspacing="0" role="presentation" width="100%">
              <tr><td align="center" style="padding:0 0 10px;">
                <img alt="{{icon1Alt}}" src="{{icon1Url}}" style="border:none; display:block; margin:0 auto;" width="40">
              </td></tr>
              <tr><td align="center" style="padding:0 0 20px; font-family:Helvetica, Arial, sans-serif; font-size:16px; line-height:20px; color:{{textColor}}; mso-color-alt:{{textColor}};" valign="top">
                <div class="body-text">{{icon1Text}}</div>
              </td></tr>
            </table>
          </td>
          <td align="center" class="icon-col" style="width:25%; padding:10px;" valign="top">
            <table border="0" cellpadding="0" cellspacing="0" role="presentation" width="100%">
              <tr><td align="center" style="padding:0 0 10px;">
                <img alt="{{icon2Alt}}" src="{{icon2Url}}" style="border:none; display:block; margin:0 auto;" width="40">
              </td></tr>
              <tr><td align="center" style="padding:0 0 20px; font-family:Helvetica, Arial, sans-serif; font-size:16px; line-height:20px; color:{{textColor}}; mso-color-alt:{{textColor}};" valign="top">
                <div class="body-text">{{icon2Text}}</div>
              </td></tr>
            </table>
          </td>
          <td align="center" class="icon-col" style="width:25%; padding:10px;" valign="top">
            <table border="0" cellpadding="0" cellspacing="0" role="presentation" width="100%">
              <tr><td align="center" style="padding:0 0 10px;">
                <img alt="{{icon3Alt}}" src="{{icon3Url}}" style="border:none; display:block; margin:0 auto;" width="40">
              </td></tr>
              <tr><td align="center" style="padding:0 0 20px; font-family:Helvetica, Arial, sans-serif; font-size:16px; line-height:20px; color:{{textColor}}; mso-color-alt:{{textColor}};" valign="top">
                <div class="body-text">{{icon3Text}}</div>
              </td></tr>
            </table>
          </td>
          <td align="center" class="icon-col" style="width:25%; padding:10px;" valign="top">
            <table border="0" cellpadding="0" cellspacing="0" role="presentation" width="100%">
              <tr><td align="center" style="padding:0 0 10px;">
                <img alt="{{icon4Alt}}" src="{{icon4Url}}" style="border:none; display:block; margin:0 auto;" width="40">
              </td></tr>
              <tr><td align="center" style="padding:0 0 20px; font-family:Helvetica, Arial, sans-serif; font-size:16px; line-height:20px; color:{{textColor}}; mso-color-alt:{{textColor}};" valign="top">
                <div class="body-text">{{icon4Text}}</div>
              </td></tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
  <tr>
    <td align="center" style="padding:0 0 40px;">
      <div>
        <!--[if mso]>
        <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word"
          href="{{ctaUrl}}"
          style="height:44px; v-text-anchor:middle; width:{{btnWidth}}px;"
          arcsize="50%"
          strokecolor="{{btnColor}}"
          fillcolor="{{btnColor}}">
          <w:anchorlock/>
          <center style="color:{{btnTextColor}}; font-family:Helvetica, Arial, sans-serif; font-size:14px; font-weight:bold;">
            {{ctaLabel}}
          </center>
        </v:roundrect>
        <![endif]-->
        <!--[if !mso]><!-->
        <a class="cta-button"
           href="{{ctaUrl}}"
           style="display:inline-block; background-color:{{btnColor}}; color:{{btnTextColor}}; font-family:Helvetica, Arial, sans-serif, Roboto; font-size:14px; line-height:18px; font-weight:bold; text-align:center; text-decoration:none; padding:12px 24px; border-radius:24px;">{{ctaLabel}}</a>
        <!--<![endif]-->
      </div>
    </td>
  </tr>
</table>
