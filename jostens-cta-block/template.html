<table class="cta-section" role="presentation" width="100%" style="background-color:{{bgColor}};">
  <!--[if mso]>
  <style>
    [data-ogsb] .cta-section v\:roundrect {
      fill: {{btnColor}} !important;
    }
    [data-ogsb] .cta-section center {
      color: {{btnTextColor}} !important;
    }
    [data-ogsb] .cta-section .cta-button {
      background-color: {{btnColor}} !important;
      color: {{btnTextColor}} !important;
    }
  </style>
  <![endif]-->
  <tr>
    <td align="center" style="padding:32px 20px 10px; font-family:Helvetica, Arial, sans-serif, Roboto; font-size:20px; line-height:26px; font-weight:bold; letter-spacing:1px; color:{{textColor}}; mso-color-alt:{{textColor}};">
      <div class="header-text" data-label="Header Text">{{headerText}}</div>
    </td>
  </tr>
  <tr>
    <td align="center" style="padding:0 20px 20px; font-family:Helvetica, Arial, sans-serif; font-size:15px; line-height:24px; color:{{textColor}}; mso-color-alt:{{textColor}};">
      <div class="body-text" data-label="Body Text">{{bodyText}}</div>
    </td>
  </tr>
  <tr>
    <td align="center" style="padding:0 0 28px;">
      <div>
        <!--[if mso]>
        <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word"
          href="{{ctaUrl}}"
          style="height:44px; v-text-anchor:middle; width:260px;"
          arcsize="50%"
          strokecolor="{{btnColor}}"
          fillcolor="{{btnColor}}">
          <w:anchorlock/>
          <center style="color:{{btnTextColor}}; font-family:Helvetica, Arial, sans-serif; font-size:14px; font-weight:bold;">
            {{ctaLabel}}
          </center>
        </v:roundrect>
        <![endif]-->
        <!--[if !mso]><!-->
        <a class="cta-button"
           href="{{ctaUrl}}"
           style="display:inline-block; background-color:{{btnColor}}; color:{{btnTextColor}}; font-family:Helvetica, Arial, sans-serif, Roboto; font-size:14px; line-height:18px; font-weight:bold; text-align:center; text-decoration:none; padding:12px 24px; border-radius:24px;">{{ctaLabel}}</a>
        <!--<![endif]-->
      </div>
    </td>
  </tr>
</table>
