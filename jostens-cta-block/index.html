<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jostens CTA Block</title>
  <script src="https://cdn.jsdelivr.net/npm/blocksdk@1.3.0/blocksdk.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Helvetica, Arial, sans-serif;
      font-size: 13px;
      color: #333;
      padding: 16px;
      background: #f9f9f9;
    }

    .section-title {
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #888;
      margin: 20px 0 10px;
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 4px;
    }

    .section-title:first-child { margin-top: 0; }

    .field { margin-bottom: 14px; }

    .field-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .field-header label:first-child { margin-bottom: 0; }

    .toggle-check {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: normal;
      color: #888;
      cursor: pointer;
      user-select: none;
    }

    .toggle-check input[type="checkbox"] {
      width: auto;
      cursor: pointer;
      margin: 0;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #444;
      margin-bottom: 4px;
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
      font-family: Helvetica, Arial, sans-serif;
      color: #333;
      background: #fff;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus,
    textarea:focus {
      outline: none;
      border-color: #D22E7A;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    input[type="number"] {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
      font-family: Helvetica, Arial, sans-serif;
      color: #333;
      background: #fff;
      transition: border-color 0.15s;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: #D22E7A;
    }

    .padding-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .padding-cell label {
      font-size: 11px;
      font-weight: normal;
      color: #888;
      margin-bottom: 2px;
    }

    .color-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="color"] {
      width: 36px;
      height: 36px;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 2px;
      cursor: pointer;
      background: #fff;
      flex-shrink: 0;
    }

    .color-hex { flex: 1; }

    .swatch-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    .swatch {
      width: 28px;
      height: 28px;
      border-radius: 4px;
      cursor: pointer;
      border: 2px solid transparent;
      padding: 0;
      flex-shrink: 0;
      transition: border-color 0.15s;
    }

    .swatch:hover { border-color: #999; }
    .swatch.active { border-color: #333; }

    .hint {
      font-size: 11px;
      color: #999;
      margin-top: 3px;
    }

    .align-btns {
      display: flex;
      border: 1px solid #ddd;
      border-radius: 4px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .align-btn {
      padding: 3px 7px;
      font-size: 11px;
      font-weight: 700;
      border: none;
      border-right: 1px solid #ddd;
      background: #fff;
      cursor: pointer;
      color: #888;
      line-height: 1;
      transition: background 0.1s, color 0.1s;
    }

    .align-btn:last-child { border-right: none; }
    .align-btn:hover { background: #f0f0f0; color: #555; }
    .align-btn.active { background: #D22E7A; color: #fff; }
    .align-btns.disabled { opacity: 0.35; pointer-events: none; }

    .swatch-none {
      background: linear-gradient(to bottom right, #fff calc(50% - 1px), #bbb calc(50% - 1px), #bbb calc(50% + 1px), #fff calc(50% + 1px));
      border-color: #ddd;
    }

    .bg-color-row-disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    .preview-wrap {
      margin-top: 24px;
      border-top: 1px solid #e0e0e0;
      padding-top: 16px;
    }

    .preview-label {
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #888;
      margin-bottom: 10px;
    }

    /* Preview table styles */
    .cta-preview {
      width: 100%;
      border-collapse: collapse;
    }

    .cta-button-preview {
      display: inline-block;
      font-family: Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: bold;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 24px;
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- ─── Content Fields ─── -->
  <div class="section-title">Content</div>

  <div class="field">
    <div class="field-header">
      <label for="headerText">Header Text</label>
      <div style="display:flex; align-items:center; gap:6px;">
        <div class="align-btns" id="headerAlignBtns">
          <button class="align-btn" data-align="left">L</button>
          <button class="align-btn active" data-align="center">C</button>
          <button class="align-btn" data-align="right">R</button>
        </div>
        <label class="toggle-check"><input type="checkbox" id="showHeader" checked> Show</label>
      </div>
    </div>
    <input type="text" id="headerText" placeholder="THE JOSTENS DIFFERENCE" value="THE JOSTENS DIFFERENCE" />
  </div>

  <div class="field">
    <div class="field-header">
      <label for="bodyText">Body Text</label>
      <div style="display:flex; align-items:center; gap:6px;">
        <div class="align-btns" id="bodyAlignBtns">
          <button class="align-btn" data-align="left">L</button>
          <button class="align-btn active" data-align="center">C</button>
          <button class="align-btn" data-align="right">R</button>
        </div>
        <label class="toggle-check"><input type="checkbox" id="showBody" checked> Show</label>
      </div>
    </div>
    <textarea id="bodyText" placeholder="Enter body copy..."></textarea>
  </div>

  <div class="field">
    <div class="field-header">
      <label for="ctaLabel">Button Label</label>
      <div style="display:flex; align-items:center; gap:6px;">
        <div class="align-btns" id="btnAlignBtns">
          <button class="align-btn" data-align="left">L</button>
          <button class="align-btn active" data-align="center">C</button>
          <button class="align-btn" data-align="right">R</button>
        </div>
        <label class="toggle-check"><input type="checkbox" id="showBtn" checked> Show</label>
      </div>
    </div>
    <input type="text" id="ctaLabel" placeholder="LET'S PARTNER TOGETHER" value="LET'S PARTNER TOGETHER" />
  </div>

  <div class="field">
    <label for="ctaUrl">Button URL</label>
    <input type="text" id="ctaUrl" placeholder="%%=RedirectTo(@URL)=%% or https://..." />
    <div class="hint">Accepts plain URLs or AMPscript expressions.</div>
  </div>

  <!-- ─── Style Fields ─── -->
  <div class="section-title">Style</div>

  <div class="field">
    <label>Global Alignment</label>
    <div class="align-btns" id="globalAlignBtns">
      <button class="align-btn" data-align="left">Left</button>
      <button class="align-btn active" data-align="center">Center</button>
      <button class="align-btn" data-align="right">Right</button>
    </div>
  </div>

  <div class="field">
    <label>Background Color</label>
    <div class="swatch-row">
      <button class="swatch swatch-none" data-color="transparent" title="No background"></button>
      <button class="swatch" data-color="#00ACD8" style="background:#00ACD8;" title="Teal"></button>
      <button class="swatch" data-color="#79BB2F" style="background:#79BB2F;" title="Green"></button>
      <button class="swatch" data-color="#D22E7A" style="background:#D22E7A;" title="Pink"></button>
      <button class="swatch" data-color="#264496" style="background:#264496;" title="Blue"></button>
    </div>
    <div class="color-row" id="bgColorRow">
      <input type="color" id="bgColorPicker" value="#D22E7A" />
      <input type="text" id="bgColor" class="color-hex" placeholder="#D22E7A" value="#D22E7A" />
    </div>
  </div>

  <div class="field">
    <label>Text Color</label>
    <div class="color-row">
      <input type="color" id="textColorPicker" value="#ffffff" />
      <input type="text" id="textColor" class="color-hex" placeholder="#ffffff" value="#ffffff" />
    </div>
  </div>

  <div class="field">
    <label>Button Background Color</label>
    <div class="color-row">
      <input type="color" id="btnColorPicker" value="#000000" />
      <input type="text" id="btnColor" class="color-hex" placeholder="#000000" value="#000000" />
    </div>
  </div>

  <div class="field">
    <label>Button Text Color</label>
    <div class="color-row">
      <input type="color" id="btnTextColorPicker" value="#ffffff" />
      <input type="text" id="btnTextColor" class="color-hex" placeholder="#ffffff" value="#ffffff" />
    </div>
  </div>

  <div class="field">
    <div class="field-header">
      <label>Padding</label>
      <label class="toggle-check"><input type="checkbox" id="paddingPerSide"> Per side</label>
    </div>
    <div id="paddingAllWrap">
      <input type="number" id="paddingAll" min="0" value="0" placeholder="0" />
      <div class="hint">px — applied to all sides.</div>
    </div>
    <div id="paddingSidesWrap" style="display:none;">
      <div class="padding-grid">
        <div class="padding-cell"><label>Top</label><input type="number" id="paddingTop" min="0" value="0" /></div>
        <div class="padding-cell"><label>Right</label><input type="number" id="paddingRight" min="0" value="0" /></div>
        <div class="padding-cell"><label>Bottom</label><input type="number" id="paddingBottom" min="0" value="0" /></div>
        <div class="padding-cell"><label>Left</label><input type="number" id="paddingLeft" min="0" value="0" /></div>
      </div>
      <div class="hint">px — per side.</div>
    </div>
  </div>

  <!-- ─── Live Preview ─── -->
  <div class="preview-wrap">
    <div class="preview-label">Preview</div>
    <table class="cta-preview" role="presentation" id="previewTable" style="background-color:#D22E7A;">
      <tr id="previewHeaderRow">
        <td align="center" style="padding:32px 20px 10px; font-size:20px; line-height:26px; font-weight:bold; letter-spacing:1px; color:#ffffff;">
          <div id="previewHeader">THE JOSTENS DIFFERENCE</div>
        </td>
      </tr>
      <tr id="previewBodyRow">
        <td align="center" style="padding:0 20px 20px; font-size:15px; line-height:24px; color:#ffffff;">
          <div id="previewBody">Everything in the Digital Classroom is shaped by adviser feedback and built by people who understand yearbook.</div>
        </td>
      </tr>
      <tr id="previewBtnRow">
        <td id="previewBtnTd" align="center" style="padding:0 0 28px;">
          <a id="previewBtn" class="cta-button-preview" href="#" style="background-color:#000000; color:#ffffff;">LET'S PARTNER TOGETHER</a>
        </td>
      </tr>
    </table>
  </div>

  <script>
    /* ─── Defaults ─── */
    var DEFAULTS = {
      headerText:   'THE JOSTENS DIFFERENCE',
      bodyText:     'Everything in the Digital Classroom is shaped by adviser feedback and built by people who understand yearbook. When questions come up, you\'re supported by a local Jostens rep who knows your school and your goals, so you don\'t have to figure it all out alone.',
      ctaLabel:     "LET'S PARTNER TOGETHER",
      ctaUrl:       '%%=RedirectTo(@JYBKProspectFormURL)=%%',
      bgColor:      '#D22E7A',
      textColor:    '#ffffff',
      btnColor:     '#000000',
      btnTextColor: '#ffffff',
      showHeader:   true,
      showBody:     true,
      showBtn:      true,
      headerAlign:  'center',
      bodyAlign:    'center',
      btnAlign:     'center',
      paddingAll:     0,
      paddingPerSide: false,
      paddingTop:     0,
      paddingRight:   0,
      paddingBottom:  0,
      paddingLeft:    0
    };

    /* ─── Init SDK ─── */
    var BlockSDK = window.sfdc && window.sfdc.BlockSDK ? window.sfdc.BlockSDK : null;
    if (!BlockSDK) {
      console.error('BlockSDK failed to load - check CDN URL');
    }
    var sdk = new BlockSDK();
    var bgIsTransparent = false;

    /* ─── Padding helper ─── */
    function buildPaddingStyle(d) {
      if (d.paddingPerSide) {
        var t = d.paddingTop    || 0;
        var r = d.paddingRight  || 0;
        var b = d.paddingBottom || 0;
        var l = d.paddingLeft   || 0;
        if (t || r || b || l) return t + 'px ' + r + 'px ' + b + 'px ' + l + 'px';
      } else {
        var p = d.paddingAll || 0;
        if (p) return p + 'px';
      }
      return '';
    }

    /* ─── Build email HTML output from current data ─── */
    function buildContent(d) {
      var bodyTopPad = d.showHeader ? '0' : '32px';
      var btnTopPad  = (d.showHeader || d.showBody) ? '0' : '32px';

      var lines = [
        '<style>',
        d.bgColor !== 'transparent' ? '  [data-ogsb] .cta-section { background-color: ' + d.bgColor + ' !important; }' : '',
        '  [data-ogsb] .cta-section .header-text { color: ' + d.textColor + ' !important; }',
        '  [data-ogsb] .cta-section .body-text { color: ' + d.textColor + ' !important; }',
        '  [data-ogsb] .cta-section .cta-button { background-color: ' + d.btnColor + ' !important; color: ' + d.btnTextColor + ' !important; }',
        '</style>',
        '<table class="cta-section" border="0" cellpadding="0" cellspacing="0" role="presentation" style="width:100%; border-collapse:collapse; mso-table-lspace:0; mso-table-rspace:0;' + (d.bgColor !== 'transparent' ? ' background-color:' + d.bgColor + ';' : '') + '" width="100%">'
      ];

      if (d.showHeader) {
        lines.push(
          '<tr>',
          '  <td align="' + d.headerAlign + '" style="padding:32px 20px 10px; font-family:Helvetica, Arial, sans-serif, Roboto; font-size:20px; line-height:26px; font-weight:bold; letter-spacing:1px; text-align:' + d.headerAlign + '; color:' + d.textColor + '; mso-color-alt:' + d.textColor + ';">',
          '    <div class="header-text">' + d.headerText + '</div>',
          '  </td>',
          '</tr>'
        );
      }

      if (d.showBody) {
        lines.push(
          '<tr>',
          '  <td align="' + d.bodyAlign + '" style="padding:' + bodyTopPad + ' 20px 20px; font-family:Helvetica, Arial, sans-serif; font-size:15px; line-height:24px; text-align:' + d.bodyAlign + '; color:' + d.textColor + '; mso-color-alt:' + d.textColor + ';">',
          '    <div class="body-text">' + d.bodyText + '</div>',
          '  </td>',
          '</tr>'
        );
      }

      if (d.showBtn) {
        lines.push(
          '<tr>',
          '  <td align="' + d.btnAlign + '" style="padding:' + btnTopPad + ' 20px 28px; text-align:' + d.btnAlign + ';">',
          '    <div>',
          '    <!--[if mso]>',
          '    <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word"',
          '      href="' + d.ctaUrl + '"',
          '      style="height:44px; v-text-anchor:middle; width:' + Math.max(180, d.ctaLabel.length * 9 + 96) + 'px;"',
          '      arcsize="50%" strokecolor="' + d.btnColor + '" fillcolor="' + d.btnColor + '">',
          '      <w:anchorlock/>',
          '      <center style="color:' + d.btnTextColor + '; mso-color-alt:' + d.btnTextColor + '; font-family:Helvetica, Arial, sans-serif; font-size:14px; font-weight:bold;">',
          '        ' + d.ctaLabel,
          '      </center>',
          '    </v:roundrect>',
          '    <![endif]-->',
          '    <!--[if !mso]><!-->',
          '    <a alias="Button_CTA_Link" class="cta-button" href="' + d.ctaUrl + '" style="display:inline-block; background-color:' + d.btnColor + '; text-decoration:none; padding:12px 24px; border-radius:24px;"><span style="color:' + d.btnTextColor + ' !important; mso-color-alt:' + d.btnTextColor + '; font-family:Helvetica, Arial, sans-serif, Roboto; font-size:14px; line-height:18px; font-weight:bold; text-align:center;">' + d.ctaLabel + '</span></a>',
          '    <!--<![endif]-->',
          '    </div>',
          '  </td>',
          '</tr>'
        );
      }

      lines.push('</table>');
      var html = lines.join('\n');
      var paddingStyle = buildPaddingStyle(d);
      if (paddingStyle) {
        return '<table role="presentation" border="0" cellpadding="0" cellspacing="0" style="width:100%; border-collapse:collapse; mso-table-lspace:0; mso-table-rspace:0;" width="100%"><tr><td style="padding:' + paddingStyle + ';">' + html + '</td></tr></table>';
      }
      return html;
    }

    /* ─── Update live preview ─── */
    function updatePreview(d) {
      updateSwatchActive(d.bgColor);
      syncAlignDisabled();
      document.getElementById('previewTable').style.backgroundColor = d.bgColor !== 'transparent' ? d.bgColor : '';
      document.getElementById('previewHeader').style.color = d.textColor;
      document.getElementById('previewHeader').style.textAlign = d.headerAlign;
      document.getElementById('previewHeader').innerHTML = d.headerText;
      document.getElementById('previewBody').style.color = d.textColor;
      document.getElementById('previewBody').style.textAlign = d.bodyAlign;
      document.getElementById('previewBody').innerHTML = d.bodyText;
      var btn = document.getElementById('previewBtn');
      btn.style.backgroundColor = d.btnColor;
      btn.style.color = d.btnTextColor;
      btn.textContent = d.ctaLabel;
      btn.setAttribute('href', d.ctaUrl || '#');
      document.getElementById('previewBtnTd').setAttribute('align', d.btnAlign);
      document.getElementById('previewBtnTd').style.textAlign = d.btnAlign;

      document.getElementById('previewHeaderRow').style.display = d.showHeader ? '' : 'none';
      document.getElementById('previewBodyRow').style.display   = d.showBody   ? '' : 'none';
      document.getElementById('previewBtnRow').style.display    = d.showBtn    ? '' : 'none';
    }

    /* ─── Read all field values into a data object ─── */
    function readFields() {
      return {
        headerText:   document.getElementById('headerText').value   || DEFAULTS.headerText,
        bodyText:     document.getElementById('bodyText').value     || DEFAULTS.bodyText,
        ctaLabel:     document.getElementById('ctaLabel').value     || DEFAULTS.ctaLabel,
        ctaUrl:       document.getElementById('ctaUrl').value       || DEFAULTS.ctaUrl,
        bgColor:      bgIsTransparent ? 'transparent' : (document.getElementById('bgColor').value || DEFAULTS.bgColor),
        textColor:    document.getElementById('textColor').value    || DEFAULTS.textColor,
        btnColor:     document.getElementById('btnColor').value     || DEFAULTS.btnColor,
        btnTextColor: document.getElementById('btnTextColor').value || DEFAULTS.btnTextColor,
        showHeader:   document.getElementById('showHeader').checked,
        showBody:     document.getElementById('showBody').checked,
        showBtn:      document.getElementById('showBtn').checked,
        headerAlign:  readAlign('headerAlignBtns'),
        bodyAlign:    readAlign('bodyAlignBtns'),
        btnAlign:     readAlign('btnAlignBtns'),
        paddingAll:     parseInt(document.getElementById('paddingAll').value)     || 0,
        paddingPerSide: document.getElementById('paddingPerSide').checked,
        paddingTop:     parseInt(document.getElementById('paddingTop').value)     || 0,
        paddingRight:   parseInt(document.getElementById('paddingRight').value)   || 0,
        paddingBottom:  parseInt(document.getElementById('paddingBottom').value)  || 0,
        paddingLeft:    parseInt(document.getElementById('paddingLeft').value)    || 0
      };
    }

    /* ─── Populate fields from a saved data object ─── */
    function populateFields(d) {
      document.getElementById('headerText').value = d.headerText   || DEFAULTS.headerText;
      document.getElementById('bodyText').value   = d.bodyText     || DEFAULTS.bodyText;
      document.getElementById('ctaLabel').value   = d.ctaLabel     || DEFAULTS.ctaLabel;
      document.getElementById('ctaUrl').value     = d.ctaUrl       || DEFAULTS.ctaUrl;

      if (d.bgColor === 'transparent') {
        bgIsTransparent = true;
        document.getElementById('bgColorRow').classList.add('bg-color-row-disabled');
      } else {
        bgIsTransparent = false;
        setColor('bgColor', 'bgColorPicker', d.bgColor || DEFAULTS.bgColor);
        document.getElementById('bgColorRow').classList.remove('bg-color-row-disabled');
      }
      setColor('textColor',    'textColorPicker',    d.textColor    || DEFAULTS.textColor);
      setColor('btnColor',     'btnColorPicker',     d.btnColor     || DEFAULTS.btnColor);
      setColor('btnTextColor', 'btnTextColorPicker', d.btnTextColor || DEFAULTS.btnTextColor);

      document.getElementById('showHeader').checked = d.showHeader !== false;
      document.getElementById('showBody').checked   = d.showBody   !== false;
      document.getElementById('showBtn').checked    = d.showBtn    !== false;

      setAlign('headerAlignBtns', d.headerAlign || 'center');
      setAlign('bodyAlignBtns',   d.bodyAlign   || 'center');
      setAlign('btnAlignBtns',    d.btnAlign    || 'center');
      setAlign('globalAlignBtns', d.headerAlign || 'center');
      document.getElementById('paddingAll').value       = d.paddingAll    !== undefined ? d.paddingAll    : 0;
      document.getElementById('paddingPerSide').checked = !!d.paddingPerSide;
      document.getElementById('paddingTop').value       = d.paddingTop    !== undefined ? d.paddingTop    : 0;
      document.getElementById('paddingRight').value     = d.paddingRight  !== undefined ? d.paddingRight  : 0;
      document.getElementById('paddingBottom').value    = d.paddingBottom !== undefined ? d.paddingBottom : 0;
      document.getElementById('paddingLeft').value      = d.paddingLeft   !== undefined ? d.paddingLeft   : 0;
      document.getElementById('paddingAllWrap').style.display   = d.paddingPerSide ? 'none' : '';
      document.getElementById('paddingSidesWrap').style.display = d.paddingPerSide ? '' : 'none';
    }

    function setColor(hexId, pickerId, value) {
      document.getElementById(hexId).value    = value;
      document.getElementById(pickerId).value = value;
    }

    /* ─── Push updated content and data to SDK ─── */
    function onChange() {
      var d = readFields();
      updatePreview(d);
      sdk.setData(d, function() {
        /*
          setContent: the real email HTML sent at send time.
          AMPscript in ctaUrl is preserved here and resolves at send time.
        */
        sdk.setContent(buildContent(d));

        /*
          setSuperContent: shown on the Content Builder canvas preview only.
          We swap AMPscript URLs for a safe placeholder so the canvas renders cleanly.
          Per SDK docs, setSuperContent is ignored at send time.
        */
        var previewData = Object.assign({}, d, {
          ctaUrl: d.ctaUrl.indexOf('%%') === -1 ? d.ctaUrl : '#'
        });
        sdk.setSuperContent(buildContent(previewData));
      });
    }

    /* ─── Alignment helpers ─── */
    function syncAlignDisabled() {
      document.getElementById('headerAlignBtns').classList.toggle('disabled', !document.getElementById('showHeader').checked);
      document.getElementById('bodyAlignBtns').classList.toggle('disabled',   !document.getElementById('showBody').checked);
      document.getElementById('btnAlignBtns').classList.toggle('disabled',    !document.getElementById('showBtn').checked);
    }

    function readAlign(groupId) {
      var active = document.querySelector('#' + groupId + ' .align-btn.active');
      return active ? active.getAttribute('data-align') : 'center';
    }

    function setAlign(groupId, value) {
      document.querySelectorAll('#' + groupId + ' .align-btn').forEach(function(btn) {
        btn.classList.toggle('active', btn.getAttribute('data-align') === (value || 'center'));
      });
    }

    function bindAlignGroup(groupId) {
      document.querySelectorAll('#' + groupId + ' .align-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          setAlign(groupId, this.getAttribute('data-align'));
          onChange();
        });
      });
    }

    /* ─── Bind color pickers <-> hex inputs ─── */
    function bindColorPair(pickerId, hexId) {
      document.getElementById(pickerId).addEventListener('input', function() {
        document.getElementById(hexId).value = this.value;
        onChange();
      });
      document.getElementById(hexId).addEventListener('input', function() {
        if (/^#[0-9A-Fa-f]{6}$/.test(this.value)) {
          document.getElementById(pickerId).value = this.value;
        }
        onChange();
      });
    }

    bindColorPair('bgColorPicker',      'bgColor');
    bindColorPair('textColorPicker',    'textColor');
    bindColorPair('btnColorPicker',     'btnColor');
    bindColorPair('btnTextColorPicker', 'btnTextColor');

    document.querySelectorAll('#globalAlignBtns .align-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var align = this.getAttribute('data-align');
        setAlign('globalAlignBtns', align);
        setAlign('headerAlignBtns', align);
        setAlign('bodyAlignBtns',   align);
        setAlign('btnAlignBtns',    align);
        onChange();
      });
    });
    bindAlignGroup('headerAlignBtns');
    bindAlignGroup('bodyAlignBtns');
    bindAlignGroup('btnAlignBtns');

    /* ─── Bind background color swatches ─── */
    function updateSwatchActive(color) {
      document.querySelectorAll('.swatch').forEach(function(s) {
        s.classList.toggle('active', s.getAttribute('data-color').toLowerCase() === color.toLowerCase());
      });
    }

    document.querySelectorAll('.swatch').forEach(function(swatch) {
      swatch.addEventListener('click', function() {
        var color = this.getAttribute('data-color');
        if (color === 'transparent') {
          bgIsTransparent = true;
          document.getElementById('bgColorRow').classList.add('bg-color-row-disabled');
        } else {
          bgIsTransparent = false;
          setColor('bgColor', 'bgColorPicker', color);
          document.getElementById('bgColorRow').classList.remove('bg-color-row-disabled');
        }
        onChange();
      });
    });

    /* ─── Bind text fields and toggles ─── */
    ['headerText', 'bodyText', 'ctaLabel', 'ctaUrl'].forEach(function(id) {
      document.getElementById(id).addEventListener('input', onChange);
    });

    ['showHeader', 'showBody', 'showBtn'].forEach(function(id) {
      document.getElementById(id).addEventListener('change', onChange);
    });

    document.getElementById('paddingPerSide').addEventListener('change', function() {
      document.getElementById('paddingAllWrap').style.display   = this.checked ? 'none' : '';
      document.getElementById('paddingSidesWrap').style.display = this.checked ? '' : 'none';
      onChange();
    });
    ['paddingAll', 'paddingTop', 'paddingRight', 'paddingBottom', 'paddingLeft'].forEach(function(id) {
      document.getElementById(id).addEventListener('input', onChange);
    });

    /* ─── On load: render defaults immediately, then restore saved data ─── */
    updatePreview(DEFAULTS);
    sdk.getData(function(savedData) {
      var d = (savedData && Object.keys(savedData).length > 0) ? savedData : DEFAULTS;
      populateFields(d);
      updatePreview(d);
      sdk.setContent(buildContent(d));
      var previewData = Object.assign({}, d, {
        ctaUrl: d.ctaUrl.indexOf('%%') === -1 ? d.ctaUrl : '#'
      });
      sdk.setSuperContent(buildContent(previewData));
    });
  </script>
</body>
</html>
