<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jostens List Block</title>
  <script src="https://cdn.jsdelivr.net/npm/blocksdk@1.3.0/blocksdk.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Helvetica, Arial, sans-serif;
      font-size: 13px;
      color: #333;
      padding: 16px;
      background: #f9f9f9;
    }

    .section-title {
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #888;
      margin: 20px 0 10px;
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 4px;
    }

    .section-title:first-child { margin-top: 0; }

    .field { margin-bottom: 14px; }

    .field-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .field-header label:first-child { margin-bottom: 0; }

    .toggle-check {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: normal;
      color: #888;
      cursor: pointer;
      user-select: none;
    }

    .toggle-check input[type="checkbox"] {
      width: auto;
      cursor: pointer;
      margin: 0;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #444;
      margin-bottom: 4px;
    }

    input[type="text"],
    textarea,
    select {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
      font-family: Helvetica, Arial, sans-serif;
      color: #333;
      background: #fff;
      transition: border-color 0.15s;
      appearance: auto;
    }

    input[type="text"]:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: #D22E7A;
    }

    textarea {
      resize: vertical;
      min-height: 60px;
    }

    input[type="number"] {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
      font-family: Helvetica, Arial, sans-serif;
      color: #333;
      background: #fff;
      transition: border-color 0.15s;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: #D22E7A;
    }

    .padding-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .padding-cell label {
      font-size: 11px;
      font-weight: normal;
      color: #888;
      margin-bottom: 2px;
    }

    .color-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="color"] {
      width: 36px;
      height: 36px;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 2px;
      cursor: pointer;
      background: #fff;
      flex-shrink: 0;
    }

    .color-hex { flex: 1; }

    .swatch-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    .swatch {
      width: 28px;
      height: 28px;
      border-radius: 4px;
      cursor: pointer;
      border: 2px solid transparent;
      padding: 0;
      flex-shrink: 0;
      transition: border-color 0.15s;
    }

    .swatch:hover { border-color: #999; }
    .swatch.active { border-color: #333; }

    .swatch-none {
      background: linear-gradient(to bottom right, #fff calc(50% - 1px), #bbb calc(50% - 1px), #bbb calc(50% + 1px), #fff calc(50% + 1px));
      border-color: #ddd;
    }

    .bg-color-row-disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    .hint {
      font-size: 11px;
      color: #999;
      margin-top: 3px;
    }

    .align-btns {
      display: flex;
      border: 1px solid #ddd;
      border-radius: 4px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .align-btn {
      padding: 3px 7px;
      font-size: 11px;
      font-weight: 700;
      border: none;
      border-right: 1px solid #ddd;
      background: #fff;
      cursor: pointer;
      color: #888;
      line-height: 1;
      transition: background 0.1s, color 0.1s;
    }

    .align-btn:last-child { border-right: none; }
    .align-btn:hover { background: #f0f0f0; color: #555; }
    .align-btn.active { background: #D22E7A; color: #fff; }
    .align-btns.disabled { opacity: 0.35; pointer-events: none; }

    .layout-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 0;
    }

    .layout-tab {
      flex: 1;
      padding: 6px 4px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      color: #888;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .layout-tab:hover { border-color: #aaa; color: #555; }

    .layout-tab.active {
      background: #D22E7A;
      color: #fff;
      border-color: #D22E7A;
    }

    .liststyle-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 0;
    }

    .liststyle-tab {
      flex: 1;
      padding: 6px 4px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      color: #888;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .liststyle-tab:hover { border-color: #aaa; color: #555; }

    .liststyle-tab.active {
      background: #D22E7A;
      color: #fff;
      border-color: #D22E7A;
    }

    .item-group {
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 10px;
      background: #fff;
    }

    .item-group-title {
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #aaa;
      margin-bottom: 10px;
    }

    .preview-wrap {
      margin-top: 24px;
      border-top: 1px solid #e0e0e0;
      padding-top: 16px;
    }

    .preview-label {
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #888;
      margin-bottom: 10px;
    }

    #previewTable {
      width: 100%;
      border-collapse: collapse;
    }

    .preview-btn {
      display: inline-block;
      font-family: Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: bold;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 24px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <!-- ─── Content ─── -->
  <div class="section-title">Content</div>

  <div class="field">
    <div class="field-header">
      <label for="headerText">Header Text</label>
      <div style="display:flex; align-items:center; gap:6px;">
        <div class="align-btns" id="headerAlignBtns">
          <button class="align-btn" data-align="left">L</button>
          <button class="align-btn active" data-align="center">C</button>
          <button class="align-btn" data-align="right">R</button>
        </div>
        <label class="toggle-check"><input type="checkbox" id="showHeader" checked> Show</label>
      </div>
    </div>
    <input type="text" id="headerText" placeholder="Section Header" />
  </div>

  <div class="field">
    <div class="field-header">
      <label for="bodyText">Body Text</label>
      <div style="display:flex; align-items:center; gap:6px;">
        <div class="align-btns" id="bodyAlignBtns">
          <button class="align-btn" data-align="left">L</button>
          <button class="align-btn active" data-align="center">C</button>
          <button class="align-btn" data-align="right">R</button>
        </div>
        <label class="toggle-check"><input type="checkbox" id="showBody"> Show</label>
      </div>
    </div>
    <textarea id="bodyText" placeholder="Optional section intro text..."></textarea>
  </div>

  <!-- ─── Layout ─── -->
  <div class="section-title">Layout</div>

  <div class="field">
    <label>List Style</label>
    <div class="liststyle-tabs">
      <button class="liststyle-tab active" data-liststyle="icon">Icon</button>
      <button class="liststyle-tab" data-liststyle="checkbox">Checkmark</button>
      <button class="liststyle-tab" data-liststyle="bullet">Bullet</button>
      <button class="liststyle-tab" data-liststyle="numbered">Numbered</button>
    </div>
  </div>

  <div class="field" id="orientationField">
    <label>Orientation</label>
    <div class="layout-tabs">
      <button class="layout-tab active" data-layout="horizontal">Horizontal</button>
      <button class="layout-tab" data-layout="vertical">Vertical</button>
    </div>
  </div>

  <div class="field">
    <label for="itemCount">Number of Items</label>
    <select id="itemCount">
      <option value="1">1</option>
      <option value="2" selected>2</option>
      <option value="3">3</option>
      <option value="4">4</option>
    </select>
  </div>

  <div class="field">
    <label>Item Text Alignment</label>
    <div class="align-btns" id="itemAlignBtns">
      <button class="align-btn" data-align="left">L</button>
      <button class="align-btn active" data-align="center">C</button>
      <button class="align-btn" data-align="right">R</button>
    </div>
  </div>

  <div class="field" id="showIconsField">
    <label class="toggle-check" style="font-size:12px; font-weight:600; color:#444; gap:6px;">
      <input type="checkbox" id="showIcons" checked> Show Icons
    </label>
    <div class="hint">80×80px. Upload to SFMC Content Builder and paste the URL in each item.</div>
  </div>

  <!-- ─── Items ─── -->
  <div class="section-title">Items</div>

  <div class="item-group" id="itemGroup1">
    <div class="item-group-title">Item 1</div>
    <div class="field" id="item1IconUrlField">
      <label for="item1IconUrl">Icon URL</label>
      <input type="text" id="item1IconUrl" placeholder="https://..." />
    </div>
    <div class="field" id="item1AltTextField">
      <label for="item1AltText">Icon Alt Text</label>
      <input type="text" id="item1AltText" placeholder="Describe the icon for screen readers" />
    </div>
    <div class="field">
      <div class="field-header">
        <label for="item1Header">Header</label>
        <label class="toggle-check"><input type="checkbox" id="item1ShowHeader" checked> Show</label>
      </div>
      <input type="text" id="item1Header" placeholder="Item Header" />
    </div>
    <div class="field">
      <div class="field-header">
        <label for="item1Body">Body</label>
        <label class="toggle-check"><input type="checkbox" id="item1ShowBody" checked> Show</label>
      </div>
      <textarea id="item1Body" placeholder="Item description..."></textarea>
    </div>
    <div id="item1BtnFields">
      <div class="field">
        <div class="field-header">
          <label for="item1BtnLabel">Button Label</label>
          <label class="toggle-check"><input type="checkbox" id="item1ShowBtn" checked> Show</label>
        </div>
        <input type="text" id="item1BtnLabel" placeholder="Learn More" />
      </div>
      <div class="field">
        <label for="item1BtnUrl">Button URL</label>
        <input type="text" id="item1BtnUrl" placeholder="https://..." />
      </div>
    </div>
  </div>

  <div class="item-group" id="itemGroup2">
    <div class="item-group-title">Item 2</div>
    <div class="field" id="item2IconUrlField">
      <label for="item2IconUrl">Icon URL</label>
      <input type="text" id="item2IconUrl" placeholder="https://..." />
    </div>
    <div class="field" id="item2AltTextField">
      <label for="item2AltText">Icon Alt Text</label>
      <input type="text" id="item2AltText" placeholder="Describe the icon for screen readers" />
    </div>
    <div class="field">
      <div class="field-header">
        <label for="item2Header">Header</label>
        <label class="toggle-check"><input type="checkbox" id="item2ShowHeader" checked> Show</label>
      </div>
      <input type="text" id="item2Header" placeholder="Item Header" />
    </div>
    <div class="field">
      <div class="field-header">
        <label for="item2Body">Body</label>
        <label class="toggle-check"><input type="checkbox" id="item2ShowBody" checked> Show</label>
      </div>
      <textarea id="item2Body" placeholder="Item description..."></textarea>
    </div>
    <div id="item2BtnFields">
      <div class="field">
        <div class="field-header">
          <label for="item2BtnLabel">Button Label</label>
          <label class="toggle-check"><input type="checkbox" id="item2ShowBtn" checked> Show</label>
        </div>
        <input type="text" id="item2BtnLabel" placeholder="Learn More" />
      </div>
      <div class="field">
        <label for="item2BtnUrl">Button URL</label>
        <input type="text" id="item2BtnUrl" placeholder="https://..." />
      </div>
    </div>
  </div>

  <div class="item-group" id="itemGroup3" style="display:none;">
    <div class="item-group-title">Item 3</div>
    <div class="field" id="item3IconUrlField">
      <label for="item3IconUrl">Icon URL</label>
      <input type="text" id="item3IconUrl" placeholder="https://..." />
    </div>
    <div class="field" id="item3AltTextField">
      <label for="item3AltText">Icon Alt Text</label>
      <input type="text" id="item3AltText" placeholder="Describe the icon for screen readers" />
    </div>
    <div class="field">
      <div class="field-header">
        <label for="item3Header">Header</label>
        <label class="toggle-check"><input type="checkbox" id="item3ShowHeader" checked> Show</label>
      </div>
      <input type="text" id="item3Header" placeholder="Item Header" />
    </div>
    <div class="field">
      <div class="field-header">
        <label for="item3Body">Body</label>
        <label class="toggle-check"><input type="checkbox" id="item3ShowBody" checked> Show</label>
      </div>
      <textarea id="item3Body" placeholder="Item description..."></textarea>
    </div>
    <div id="item3BtnFields">
      <div class="field">
        <div class="field-header">
          <label for="item3BtnLabel">Button Label</label>
          <label class="toggle-check"><input type="checkbox" id="item3ShowBtn" checked> Show</label>
        </div>
        <input type="text" id="item3BtnLabel" placeholder="Learn More" />
      </div>
      <div class="field">
        <label for="item3BtnUrl">Button URL</label>
        <input type="text" id="item3BtnUrl" placeholder="https://..." />
      </div>
    </div>
  </div>

  <div class="item-group" id="itemGroup4" style="display:none;">
    <div class="item-group-title">Item 4</div>
    <div class="field" id="item4IconUrlField">
      <label for="item4IconUrl">Icon URL</label>
      <input type="text" id="item4IconUrl" placeholder="https://..." />
    </div>
    <div class="field" id="item4AltTextField">
      <label for="item4AltText">Icon Alt Text</label>
      <input type="text" id="item4AltText" placeholder="Describe the icon for screen readers" />
    </div>
    <div class="field">
      <div class="field-header">
        <label for="item4Header">Header</label>
        <label class="toggle-check"><input type="checkbox" id="item4ShowHeader" checked> Show</label>
      </div>
      <input type="text" id="item4Header" placeholder="Item Header" />
    </div>
    <div class="field">
      <div class="field-header">
        <label for="item4Body">Body</label>
        <label class="toggle-check"><input type="checkbox" id="item4ShowBody" checked> Show</label>
      </div>
      <textarea id="item4Body" placeholder="Item description..."></textarea>
    </div>
    <div id="item4BtnFields">
      <div class="field">
        <div class="field-header">
          <label for="item4BtnLabel">Button Label</label>
          <label class="toggle-check"><input type="checkbox" id="item4ShowBtn" checked> Show</label>
        </div>
        <input type="text" id="item4BtnLabel" placeholder="Learn More" />
      </div>
      <div class="field">
        <label for="item4BtnUrl">Button URL</label>
        <input type="text" id="item4BtnUrl" placeholder="https://..." />
      </div>
    </div>
  </div>

  <!-- ─── Background ─── -->
  <div class="section-title">Background</div>

  <div class="field">
    <label>Background Color</label>
    <div class="swatch-row" id="bgSwatches">
      <button class="swatch swatch-none" data-color="transparent" title="No background"></button>
      <button class="swatch" data-color="#00ACD8" style="background:#00ACD8;" title="Teal"></button>
      <button class="swatch" data-color="#79BB2F" style="background:#79BB2F;" title="Green"></button>
      <button class="swatch" data-color="#D22E7A" style="background:#D22E7A;" title="Pink"></button>
      <button class="swatch" data-color="#264496" style="background:#264496;" title="Blue"></button>
    </div>
    <div class="color-row" id="bgColorRow">
      <input type="color" id="bgColorPicker" value="#D22E7A" />
      <input type="text" id="bgColor" class="color-hex" placeholder="#D22E7A" value="#D22E7A" />
    </div>
  </div>

  <!-- ─── Style ─── -->
  <div class="section-title">Style</div>

  <div class="field">
    <label>Global Alignment</label>
    <div class="align-btns" id="globalAlignBtns">
      <button class="align-btn" data-align="left">Left</button>
      <button class="align-btn active" data-align="center">Center</button>
      <button class="align-btn" data-align="right">Right</button>
    </div>
  </div>

  <div class="field">
    <label>Text Color</label>
    <div class="color-row">
      <input type="color" id="textColorPicker" value="#ffffff" />
      <input type="text" id="textColor" class="color-hex" placeholder="#ffffff" value="#ffffff" />
    </div>
  </div>

  <div class="field">
    <label>Button Background Color</label>
    <div class="color-row">
      <input type="color" id="btnColorPicker" value="#000000" />
      <input type="text" id="btnColor" class="color-hex" placeholder="#000000" value="#000000" />
    </div>
  </div>

  <div class="field">
    <label>Button Text Color</label>
    <div class="color-row">
      <input type="color" id="btnTextColorPicker" value="#ffffff" />
      <input type="text" id="btnTextColor" class="color-hex" placeholder="#ffffff" value="#ffffff" />
    </div>
  </div>

  <div class="field">
    <div class="field-header">
      <label>Mobile Alignment</label>
      <label class="toggle-check"><input type="checkbox" id="mobileAlignEnabled"> Override</label>
    </div>
    <div id="mobileAlignWrap" style="display:none;">
      <div style="display:flex; flex-direction:column; gap:8px; margin-top:6px;">
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <span style="font-size:11px; color:#888; font-weight:600;">Header</span>
          <div class="align-btns" id="mobileHeaderAlignBtns">
            <button class="align-btn" data-align="left">L</button>
            <button class="align-btn active" data-align="center">C</button>
            <button class="align-btn" data-align="right">R</button>
          </div>
        </div>
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <span style="font-size:11px; color:#888; font-weight:600;">Body</span>
          <div class="align-btns" id="mobileBodyAlignBtns">
            <button class="align-btn" data-align="left">L</button>
            <button class="align-btn active" data-align="center">C</button>
            <button class="align-btn" data-align="right">R</button>
          </div>
        </div>
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <span style="font-size:11px; color:#888; font-weight:600;">Item Text</span>
          <div class="align-btns" id="mobileItemAlignBtns">
            <button class="align-btn" data-align="left">L</button>
            <button class="align-btn active" data-align="center">C</button>
            <button class="align-btn" data-align="right">R</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="field">
    <div class="field-header">
      <label>Padding</label>
      <label class="toggle-check"><input type="checkbox" id="paddingUniform"> All sides</label>
    </div>
    <div id="paddingAllWrap" style="display:none;">
      <input type="number" id="paddingAll" min="0" value="0" placeholder="0" />
      <div class="hint">px — applied to all sides.</div>
    </div>
    <div id="paddingSidesWrap">
      <div class="padding-grid">
        <div class="padding-cell"><label>Top</label><input type="number" id="paddingTop" min="0" value="0" /></div>
        <div class="padding-cell"><label>Right</label><input type="number" id="paddingRight" min="0" value="0" /></div>
        <div class="padding-cell"><label>Bottom</label><input type="number" id="paddingBottom" min="0" value="0" /></div>
        <div class="padding-cell"><label>Left</label><input type="number" id="paddingLeft" min="0" value="0" /></div>
      </div>
      <div class="hint">px — per side.</div>
    </div>
  </div>

  <!-- ─── Preview ─── -->
  <div class="preview-wrap">
    <div class="preview-label">Preview</div>
    <table id="previewTable" role="presentation">
      <tbody id="previewTbody"></tbody>
    </table>
  </div>

  <script>
    var DEFAULTS = {
      itemCount:    2,
      layout:       'horizontal',
      listStyle:    'icon',
      checkboxIconUrl: 'https://image.s1.sfmc-content.com/lib/fe6715707c6605797117/m/1/7704aa8d-6599-4c15-8373-1b72bb2d4617.png',
      showIcons:      true,
      showHeader:   true,
      showBody:     false,
      headerText:   'THE JOSTENS DIFFERENCE',
      bodyText:     'Optional section intro text.',
      bgColor:      '#D22E7A',
      textColor:    '#ffffff',
      btnColor:     '#000000',
      btnTextColor: '#ffffff',
      headerAlign:  'center',
      bodyAlign:    'center',
      itemAlign:    'center',
      mobileAlignEnabled:  false,
      mobileHeaderAlign:   'center',
      mobileBodyAlign:     'center',
      mobileItemAlign:     'center',
      item1IconUrl: 'https://image.s1.sfmc-content.com/lib/fe6715707c6605797117/m/1/1eeb0025-4030-45b0-9dad-5e7ed38f9ea7.png', item1AltText: '', item1Header: 'Item One',   item1ShowHeader: true, item1Body: 'Description text for this list item goes here.', item1ShowBody: true, item1BtnLabel: 'Learn More', item1BtnUrl: '#', item1ShowBtn: true,
      item2IconUrl: 'https://image.s1.sfmc-content.com/lib/fe6715707c6605797117/m/1/1eeb0025-4030-45b0-9dad-5e7ed38f9ea7.png', item2AltText: '', item2Header: 'Item Two',   item2ShowHeader: true, item2Body: 'Description text for this list item goes here.', item2ShowBody: true, item2BtnLabel: 'Learn More', item2BtnUrl: '#', item2ShowBtn: true,

            }
            r += '<td valign="top" style="text-align:' + d.itemAlign + ';">';
            if (item.showHeader !== false && item.header) r += '<div style="font-family:Helvetica,Arial,sans-serif; font-size:14px; font-weight:bold; text-align:' + d.itemAlign + '; color:' + d.textColor + '; padding-bottom:4px;">' + item.header + '</div>';
            if (item.showBody !== false && item.body) r += '<div style="font-family:Helvetica,Arial,sans-serif; font-size:12px; line-height:18px; text-align:' + d.itemAlign + '; color:' + d.textColor + '; padding-bottom:8px;">' + item.body + '</div>';
            if (item.showBtn && item.btnLabel) r += '<a class="preview-btn" style="background-color:' + d.btnColor + '; color:' + d.btnTextColor + ';">' + item.btnLabel + '</a>';
            r += '</td></tr></table></td></tr>';
            html.push(r);
          });
          html.push('<tr><td style="height:12px;"></td></tr>');
        }
      }

      tbody.innerHTML = html.join('');
      updateSwatchActive(d.bgColor);
      syncAlignDisabled();
    }

    /* ─── Read all fields ─── */
    function readFields() {
      var d = {
        itemCount:    parseInt(document.getElementById('itemCount').value) || 2,
        layout:       readLayout(),
        listStyle:    readListStyle(),
        showIcons:    document.getElementById('showIcons').checked,
        showHeader:   document.getElementById('showHeader').checked,
        showBody:     document.getElementById('showBody').checked,
        headerText:   document.getElementById('headerText').value || DEFAULTS.headerText,
        bodyText:     document.getElementById('bodyText').value   || DEFAULTS.bodyText,
        bgColor:      bgIsTransparent ? 'transparent' : (document.getElementById('bgColor').value || DEFAULTS.bgColor),
        textColor:    document.getElementById('textColor').value    || DEFAULTS.textColor,
        btnColor:     document.getElementById('btnColor').value     || DEFAULTS.btnColor,
        btnTextColor: document.getElementById('btnTextColor').value || DEFAULTS.btnTextColor,
        headerAlign:  readAlign('headerAlignBtns'),
        bodyAlign:    readAlign('bodyAlignBtns'),
        itemAlign:    readAlign('itemAlignBtns'),
        mobileAlignEnabled: document.getElementById('mobileAlignEnabled').checked,
        mobileHeaderAlign:  readAlign('mobileHeaderAlignBtns'),
        mobileBodyAlign:    readAlign('mobileBodyAlignBtns'),
        mobileItemAlign:    readAlign('mobileItemAlignBtns'),
        paddingAll:     parseInt(document.getElementById('paddingAll').value)     || 0,
        paddingUniform: document.getElementById('paddingUniform').checked,
        paddingTop:     parseInt(document.getElementById('paddingTop').value)     || 0,
        paddingRight:   parseInt(document.getElementById('paddingRight').value)   || 0,
        paddingBottom:  parseInt(document.getElementById('paddingBottom').value)  || 0,
        paddingLeft:    parseInt(document.getElementById('paddingLeft').value)    || 0
      };
      for (var i = 1; i <= 4; i++) {
        d['item' + i + 'IconUrl']    = document.getElementById('item' + i + 'IconUrl').value    || '';
        d['item' + i + 'AltText']    = document.getElementById('item' + i + 'AltText').value;
        d['item' + i + 'Header']     = document.getElementById('item' + i + 'Header').value     || '';
        d['item' + i + 'ShowHeader'] = document.getElementById('item' + i + 'ShowHeader').checked;
        d['item' + i + 'Body']       = document.getElementById('item' + i + 'Body').value       || '';
        d['item' + i + 'ShowBody']   = document.getElementById('item' + i + 'ShowBody').checked;
        d['item' + i + 'BtnLabel']   = document.getElementById('item' + i + 'BtnLabel').value   || '';
        d['item' + i + 'BtnUrl']     = document.getElementById('item' + i + 'BtnUrl').value     || '#';
        d['item' + i + 'ShowBtn']    = document.getElementById('item' + i + 'ShowBtn').checked;
      }
      return d;
    }

    /* ─── Populate fields from saved data ─── */
    function populateFields(d) {
      document.getElementById('headerText').value   = d.headerText || DEFAULTS.headerText;
      document.getElementById('bodyText').value     = d.bodyText   || DEFAULTS.bodyText;
      document.getElementById('showHeader').checked = d.showHeader !== false;
      document.getElementById('showBody').checked   = d.showBody   !== false;
      document.getElementById('showIcons').checked = d.showIcons !== false;

      showListStyleControls(d.listStyle || 'icon');

      var layout = d.layout || 'horizontal';
      document.getElementById('orientationField').querySelectorAll('.layout-tab').forEach(function(btn) {
        btn.classList.toggle('active', btn.getAttribute('data-layout') === layout);
      });

      var count = d.itemCount || 2;
      document.getElementById('itemCount').value = count;
      updateItemGroups(count);

      if (d.bgColor === 'transparent') {
        bgIsTransparent = true;
        document.getElementById('bgColorRow').classList.add('bg-color-row-disabled');
      } else {
        bgIsTransparent = false;
        setColor('bgColor', 'bgColorPicker', d.bgColor || DEFAULTS.bgColor);
        document.getElementById('bgColorRow').classList.remove('bg-color-row-disabled');
      }

      setColor('textColor',    'textColorPicker',    d.textColor    || DEFAULTS.textColor);
      setColor('btnColor',     'btnColorPicker',     d.btnColor     || DEFAULTS.btnColor);
      setColor('btnTextColor', 'btnTextColorPicker', d.btnTextColor || DEFAULTS.btnTextColor);

      for (var i = 1; i <= 4; i++) {
        document.getElementById('item' + i + 'IconUrl').value      = d['item' + i + 'IconUrl']    || '';
        document.getElementById('item' + i + 'AltText').value      = ('item' + i + 'AltText' in d) ? d['item' + i + 'AltText'] : '';
        document.getElementById('item' + i + 'Header').value       = d['item' + i + 'Header']     || '';
        document.getElementById('item' + i + 'ShowHeader').checked = d['item' + i + 'ShowHeader']  !== false;
        document.getElementById('item' + i + 'Body').value         = d['item' + i + 'Body']        || '';
        document.getElementById('item' + i + 'ShowBody').checked   = d['item' + i + 'ShowBody']    !== false;
        document.getElementById('item' + i + 'BtnLabel').value     = d['item' + i + 'BtnLabel']    || '';
        document.getElementById('item' + i + 'BtnUrl').value       = d['item' + i + 'BtnUrl']      || '';
        document.getElementById('item' + i + 'ShowBtn').checked    = d['item' + i + 'ShowBtn']     !== false;
      }

      setAlign('headerAlignBtns', d.headerAlign || 'center');
      setAlign('bodyAlignBtns',   d.bodyAlign   || 'center');
      setAlign('itemAlignBtns',   d.itemAlign   || 'center');
      setAlign('globalAlignBtns', d.headerAlign || 'center');
      document.getElementById('paddingAll').value       = d.paddingAll    !== undefined ? d.paddingAll    : 0;
      document.getElementById('paddingUniform').checked = !!d.paddingUniform;
      document.getElementById('paddingTop').value       = d.paddingTop    !== undefined ? d.paddingTop    : 0;
      document.getElementById('paddingRight').value     = d.paddingRight  !== undefined ? d.paddingRight  : 0;
      document.getElementById('paddingBottom').value    = d.paddingBottom !== undefined ? d.paddingBottom : 0;
      document.getElementById('paddingLeft').value      = d.paddingLeft   !== undefined ? d.paddingLeft   : 0;
      document.getElementById('paddingAllWrap').style.display   = d.paddingUniform ? '' : 'none';
      document.getElementById('paddingSidesWrap').style.display = d.paddingUniform ? 'none' : '';
      document.getElementById('mobileAlignEnabled').checked    = !!d.mobileAlignEnabled;
      document.getElementById('mobileAlignWrap').style.display = d.mobileAlignEnabled ? '' : 'none';
      setAlign('mobileHeaderAlignBtns', d.mobileHeaderAlign || 'center');
      setAlign('mobileBodyAlignBtns',   d.mobileBodyAlign   || 'center');
      setAlign('mobileItemAlignBtns',   d.mobileItemAlign   || 'center');
    }

    function setColor(hexId, pickerId, value) {
      document.getElementById(hexId).value    = value;
      document.getElementById(pickerId).value = value;
    }

    /* ─── Swatch active state ─── */
    function updateSwatchActive(color) {
      document.getElementById('bgSwatches').querySelectorAll('.swatch').forEach(function(s) {
        var c = (s.getAttribute('data-color') || '').toLowerCase();
        s.classList.toggle('active', c === (color || '').toLowerCase());
      });
    }

    /* ─── Push to SDK ─── */
    function onChange() {
      var d = readFields();
      updatePreview(d);
      sdk.setData(d, function() {
        sdk.setContent(buildContent(d));
        var previewData = {};
        Object.keys(d).forEach(function(k) {
          previewData[k] = (typeof d[k] === 'string' && d[k].indexOf('%%') !== -1) ? '#' : d[k];
        });
        sdk.setSuperContent(buildContent(previewData));
      });
    }

    /* ─── Alignment helpers ─── */
    function syncAlignDisabled() {
      document.getElementById('headerAlignBtns').classList.toggle('disabled', !document.getElementById('showHeader').checked);
      document.getElementById('bodyAlignBtns').classList.toggle('disabled',   !document.getElementById('showBody').checked);
    }

    function readAlign(groupId) {
      var active = document.querySelector('#' + groupId + ' .align-btn.active');
      return active ? active.getAttribute('data-align') : 'center';
    }

    function setAlign(groupId, value) {
      document.querySelectorAll('#' + groupId + ' .align-btn').forEach(function(btn) {
        btn.classList.toggle('active', btn.getAttribute('data-align') === (value || 'center'));
      });
    }

    function bindAlignGroup(groupId) {
      document.querySelectorAll('#' + groupId + ' .align-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          setAlign(groupId, this.getAttribute('data-align'));
          onChange();
        });
      });
    }

    /* ─── Color pair binding ─── */
    function bindColorPair(pickerId, hexId) {
      document.getElementById(pickerId).addEventListener('input', function() {
        document.getElementById(hexId).value = this.value;
        onChange();
      });
      document.getElementById(hexId).addEventListener('input', function() {
        if (/^#[0-9A-Fa-f]{6}$/.test(this.value)) {
          document.getElementById(pickerId).value = this.value;
        }
        onChange();
      });
    }

    bindColorPair('bgColorPicker',      'bgColor');
    bindColorPair('textColorPicker',    'textColor');
    bindColorPair('btnColorPicker',     'btnColor');
    bindColorPair('btnTextColorPicker', 'btnTextColor');

    document.querySelectorAll('#globalAlignBtns .align-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var align = this.getAttribute('data-align');
        setAlign('globalAlignBtns', align);
        setAlign('headerAlignBtns', align);
        setAlign('bodyAlignBtns',   align);
        setAlign('itemAlignBtns',   align);
        onChange();
      });
    });
    bindAlignGroup('headerAlignBtns');
    bindAlignGroup('bodyAlignBtns');
    bindAlignGroup('itemAlignBtns');

    document.getElementById('mobileAlignEnabled').addEventListener('change', function() {
      document.getElementById('mobileAlignWrap').style.display = this.checked ? '' : 'none';
      onChange();
    });
    bindAlignGroup('mobileHeaderAlignBtns');
    bindAlignGroup('mobileBodyAlignBtns');
    bindAlignGroup('mobileItemAlignBtns');

    /* ─── Swatch clicks ─── */
    document.getElementById('bgSwatches').querySelectorAll('.swatch').forEach(function(swatch) {
      swatch.addEventListener('click', function() {
        var color = this.getAttribute('data-color');
        if (color === 'transparent') {
          bgIsTransparent = true;
          document.getElementById('bgColorRow').classList.add('bg-color-row-disabled');
        } else {
          bgIsTransparent = false;
          setColor('bgColor', 'bgColorPicker', color);
          document.getElementById('bgColorRow').classList.remove('bg-color-row-disabled');
        }
        onChange();
      });
    });

    /* ─── List style tabs ─── */
    document.querySelectorAll('.liststyle-tab').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.liststyle-tab').forEach(function(b) { b.classList.remove('active'); });
        this.classList.add('active');
        showListStyleControls(this.getAttribute('data-liststyle'));
        onChange();
      });
    });

    /* ─── Layout tabs ─── */
    document.getElementById('orientationField').querySelectorAll('.layout-tab').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.getElementById('orientationField').querySelectorAll('.layout-tab').forEach(function(b) { b.classList.remove('active'); });
        this.classList.add('active');
        onChange();
      });
    });

    /* ─── Item count ─── */
    document.getElementById('itemCount').addEventListener('change', function() {
      updateItemGroups(parseInt(this.value));
      onChange();
    });

    document.getElementById('paddingUniform').addEventListener('change', function() {
      document.getElementById('paddingAllWrap').style.display   = this.checked ? '' : 'none';
      document.getElementById('paddingSidesWrap').style.display = this.checked ? 'none' : '';
      onChange();
    });
    ['paddingAll', 'paddingTop', 'paddingRight', 'paddingBottom', 'paddingLeft'].forEach(function(id) {
      document.getElementById(id).addEventListener('input', onChange);
    });

    /* ─── Text fields and toggles ─── */
    ['headerText', 'bodyText'].forEach(function(id) {
      document.getElementById(id).addEventListener('input', onChange);
    });

    ['showHeader', 'showBody', 'showIcons'].forEach(function(id) {
      document.getElementById(id).addEventListener('change', onChange);
    });

    /* ─── Per-item field bindings ─── */
    for (var n = 1; n <= 4; n++) {
      (function(i) {
        ['item' + i + 'IconUrl', 'item' + i + 'AltText', 'item' + i + 'Header', 'item' + i + 'Body', 'item' + i + 'BtnLabel', 'item' + i + 'BtnUrl'].forEach(function(id) {
          document.getElementById(id).addEventListener('input', onChange);
        });
        document.getElementById('item' + i + 'ShowHeader').addEventListener('change', onChange);
        document.getElementById('item' + i + 'ShowBody').addEventListener('change', onChange);
        document.getElementById('item' + i + 'ShowBtn').addEventListener('change', onChange);
      })(n);
    }

    /* ─── On load ─── */
    updateItemGroups(DEFAULTS.itemCount);
    updatePreview(DEFAULTS);
    showListStyleControls(DEFAULTS.listStyle);
    sdk.getData(function(savedData) {
      var d = (savedData && Object.keys(savedData).length > 0) ? savedData : DEFAULTS;
      populateFields(d);
      updatePreview(d);
      sdk.setContent(buildContent(d));
      var previewData = {};
      Object.keys(d).forEach(function(k) {
        previewData[k] = (typeof d[k] === 'string' && d[k].indexOf('%%') !== -1) ? '#' : d[k];
      });
      sdk.setSuperContent(buildContent(previewData));
    });
  </script>
</body>
</html>
